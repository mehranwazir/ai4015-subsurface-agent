[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsurface-agent"
version = "0.1.0"
description = "AI4015 Phase 1: reproducible well-log baseline and bounded tool agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.7",
  "matplotlib>=3.9,<4", "pydantic>=2.10,<3", "requests>=2.32,<3",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
subsurface = "subsurface_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
